# Pull requestit (myös Renovaten): tyypit, buildit ja selaintestit
# (sivut, saavutettavuus axe-corella, lomakkeen pakolliset kentät).
# Sivuston build käyttää tuotannon CMS:n julkista sisältöä (vain luku).
# Kuvakaappaukset: ajon artefakti "kuvakaappaukset".
name: Tarkistus

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Sama versio kuin apps/web/package.json:n @playwright/test.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter cms check
      - run: pnpm --filter web check
      - run: pnpm --filter cms build
      - run: pnpm --filter web build
      - run: pnpm --filter web test
        env:
          CI: '1'
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kuvakaappaukset
          path: |
            apps/web/screenshots/
            apps/web/playwright-report/
          retention-days: 14
