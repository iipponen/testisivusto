# Payload-image → ghcr.io/<omistaja>/<repo>-cms. Sorsalla:
#   docker compose pull && docker compose up -d
# Viikoittainen build tuo pohjaimagen (node:24-alpine) tietoturvapäivitykset.
name: CMS-image

on:
  push:
    branches: [main]
    paths:
      - apps/cms/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/cms-image.yml
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-cms
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/cms/Dockerfile
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
