# Paikallinen kehityskanta (ei tuotantoon). Tuotannossa CMS käyttää sorsan
# jaettua Postgresia (iipponen/postgres).
name: sivusto-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
